services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cleartrail-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cleartrail
      POSTGRES_PASSWORD: cleartrail
      POSTGRES_DB: cleartrail
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleartrail -d cleartrail"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
